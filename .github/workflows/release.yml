name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $appVersion = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagVersion -ne $appVersion) {
            throw "Tag version '$tagVersion' does not match APP_VERSION '$appVersion'."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test and build installer
        shell: pwsh
        run: .\Build-Windows.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" .\release\BlachCalc-Setup.exe --verify-tag --title "BlachCalc $env:GITHUB_REF_NAME" --generate-notes
